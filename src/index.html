<!doctype html>
<html lang="vi" data-bg="flowers">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffafc">
  <title>Life Planner</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css?v=gd3b">
</head>
<body>
  <div class="bg-flowers" id="bg-flowers" aria-hidden="true"></div>
  <header class="site-head">
    <div class="topbar">
      <a class="logo" href="#/hom-nay" aria-label="Life Planner, về Hôm nay">
        <svg class="logo-mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
          <rect x="6" y="5" width="28" height="32" rx="7" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.4"/>
          <path d="M12 5V2.5M18 5V2.5M24 5V2.5M30 5V2.5" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/>
          <use href="#f-daisy" x="10" y="12" width="20" height="20" style="color:var(--petal-2)"/>
          <use href="#f-sprig" x="22" y="24" width="14" height="14"/>
        </svg>
        <span class="logo-text">LIFE <span>PLANNER</span></span>
      </a>
      <span class="spacer"></span>
      <button type="button" class="round" id="btn-bg" aria-label="Chọn hình nền" aria-haspopup="true" aria-expanded="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="2.5"/><path d="M12 6.5a2.5 2.5 0 1 1 2.4 1.8M14.4 8.3a2.5 2.5 0 1 1-.9 3.2M13.5 11.5a2.5 2.5 0 1 1-3 0M10.5 11.5a2.5 2.5 0 1 1-.9-3.2M9.6 8.3A2.5 2.5 0 1 1 12 6.5M12 14v7M12 18c-2 0-3.5-1-4-3M12 19c2 0 3.5-1 4-3"/></svg>
      </button>
      <button type="button" class="round" id="btn-settings" aria-label="Cài đặt">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      </button>
      <div class="pop" id="bg-pop" hidden>
        <p class="pop-title"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16l4-4 4 4 3-3 5 5M4 5h16v14H4z"/><circle cx="15" cy="9" r="1.5"/></svg>Hình nền</p>
        <button type="button" class="opt" data-bg="flowers"><span class="swatch sw-flowers"></span>Hoa bay nhẹ, màu mờ</button>
        <button type="button" class="opt" data-bg="plain"><span class="swatch"></span>Trơn, không họa tiết</button>
      </div>
    </div>
    <div class="statusline">
      <span class="banner" id="banner" hidden>Đang dùng dữ liệu mẫu trên trình duyệt này, chưa kết nối Google Sheet.</span>
      <span class="sync" id="sync" aria-live="polite"></span>
    </div>
    <nav class="tabbar" aria-label="Các tab">
      <a class="tab" href="#/hom-nay" data-tab="today">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v8a2 2 0 0 1-2 2h-3v-6H9v6H6a2 2 0 0 1-2-2z"/></svg>
        <span>Hôm nay</span>
      </a>
      <a class="tab" href="#/muc-tieu" data-tab="goals">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3"/></svg>
        <span>Mục tiêu</span>
      </a>
      <a class="tab" href="#/task" data-tab="task">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
        <span>Task</span>
      </a>
      <a class="tab" href="#/thoi-quen" data-tab="habits">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4M9 15l2 2 4-4"/></svg>
        <span>Thói quen</span>
      </a>
      <a class="tab later" href="#/sap-co/tong-ket" data-tab="tong-ket">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V5M16 20v-7M21 20H3"/></svg>
        <span>Tổng kết</span><small class="soon">Sắp có</small>
      </a>
    </nav>
  </header>
  <main class="main" id="view"></main>

  <script src="js/config.js?v=gd3b"></script>
  <script src="js/logic.js?v=gd3b"></script>
  <script src="js/mock-data.js?v=gd3b"></script>
  <script src="js/api-mock.js?v=gd3b"></script>
  <script src="js/api-sheet.js?v=gd3b"></script>
  <script src="js/api.js?v=gd3b"></script>
  <script src="js/flowers.js?v=gd3b"></script>
  <script src="js/ui.js?v=gd3b"></script>
  <script src="js/store.js?v=gd3b"></script>
  <script src="js/components.js?v=gd3b"></script>
  <script src="js/views/today.js?v=gd3b"></script>
  <script src="js/views/goals.js?v=gd3b"></script>
  <script src="js/views/tasks.js?v=gd3b"></script>
  <script src="js/views/habits.js?v=gd3b"></script>
  <script src="js/forms.js?v=gd3b"></script>
  <script src="js/app.js?v=gd3b"></script>
</body>
</html>
