<!doctype html>
<html lang="vi" data-bg="flowers">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xem trước Agenda GĐ8: dòng thời gian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="../../src/css/style.css">
<style>
/* Chỉ để xem trước. Khi code thật sẽ chuyển vào style.css */
body{margin:0}
.g8{max-width:1180px;margin:0 auto;padding:10px 14px 130px}
.g8-top{display:flex;align-items:center;gap:6px;margin:4px 0 8px}
.g8-top h1{flex:1;margin:0;font-size:22px;line-height:1.15}
.g8-top h1 small{display:block;font-family:var(--body,inherit);font-size:13px;font-weight:700;color:var(--muted)}
.g8-nav{width:44px;height:44px;border-radius:99px;border:2px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;font-size:20px;font-weight:800}
.g8-cap{background:var(--surface);border-radius:16px;padding:8px 12px;box-shadow:var(--shadow);margin-bottom:6px}
.g8-cap-row{display:flex;flex-wrap:nowrap;gap:6px;font-size:13px;font-weight:800;align-items:baseline;white-space:nowrap}
.g8-cap-row .num{font-size:15px}
.g8-bar{display:flex;gap:6px;margin-top:6px}
.g8-bar i{display:block;height:10px;border-radius:6px;background:var(--track)}
.g8-bar i b{display:block;height:100%;border-radius:6px;background:#4f86d8}
.g8-bar i.over b{background:var(--warn-bar,#e08a3c)}
.g8-over{color:var(--warn);font-size:13px;font-weight:800;margin-top:4px}
.g8-slow{display:flex;align-items:center;gap:6px;width:100%;min-height:40px;border:0;border-radius:14px;background:var(--hot-bg);color:var(--hot);font-weight:800;font-size:13.5px;padding:4px 12px;text-align:left;margin-bottom:6px}
.g8-slow span{flex:1}
.g8-day{display:flex;gap:6px;overflow-x:auto;padding:0 0 6px;align-items:center}
.g8-day>b{font-size:12px;color:var(--muted);font-weight:800;flex:none}
.g8-chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:4px 12px 4px 6px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:14px}
.g8-chip .dot{width:26px;height:26px;border-radius:99px;border:2.5px solid var(--accent);background:transparent;display:inline-grid;place-items:center;flex:none}
.g8-chip.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.g8-streak{font-size:12px;color:var(--hot);font-weight:800;display:inline-flex;align-items:center;gap:2px}
.g8-cols{display:block}
@media (min-width:1024px){.g8-cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:22px;align-items:start}}
.g8-draft{display:flex;align-items:center;gap:8px;border:2px dashed var(--accent);border-radius:16px;background:color-mix(in srgb,var(--accent-soft) 60%,var(--surface));padding:6px 8px 6px 12px;margin-bottom:6px;font-size:12.5px;font-weight:700;line-height:1.3}
.g8-draft p{flex:1;margin:0}
.g8-seg{margin:8px 0 3px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--muted);letter-spacing:.02em;text-transform:uppercase}
.g8-seg::after{content:"";flex:1;border-top:2px solid var(--line)}
.g8-lunch{display:flex;align-items:center;gap:8px;margin:6px 0;padding:6px 12px;border-radius:12px;background:repeating-linear-gradient(135deg,var(--track) 0 8px,transparent 8px 16px);font-size:13px;font-weight:800;color:var(--muted)}
.g8-rows{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.g8-row{display:grid;grid-template-columns:40px 34px minmax(0,1fr) auto;align-items:center;gap:0 2px;min-height:52px;padding:2px 2px 2px 4px;border-radius:14px;background:var(--surface);box-shadow:0 1px 0 var(--line);position:relative}
.g8-row.draft{background:color-mix(in srgb,var(--surface) 70%,transparent);border:2px dashed color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:none}
.g8-row.now{outline:3px solid var(--accent);outline-offset:-1px}
.g8-row.done .g8-title{text-decoration:line-through;color:var(--muted)}
.g8-row.done .g8-time{color:var(--muted)}
.g8-time{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:800;font-size:12.5px;color:var(--ink);text-align:right;padding-right:2px;font-variant-numeric:tabular-nums}
.g8-tick{width:34px;height:44px;display:grid;place-items:center;border:0;background:transparent;padding:0}
.g8-tick i{width:24px;height:24px;border-radius:99px;border:2.5px solid var(--accent);display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px;font-weight:800}
.g8-row.done .g8-tick i{background:var(--ok);border-color:var(--ok)}
.g8-main{min-width:0;padding:4px 4px;line-height:1.25}
.g8-title{font-weight:800;font-size:14px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.g8-tags{display:flex;flex-wrap:nowrap;gap:4px;margin-top:2px;overflow:hidden}
.g8-tag{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:3px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:800;line-height:1.7;background:var(--plain-bg);color:var(--muted)}
.g8-tag.hot{background:var(--hot-bg);color:var(--hot)}
.g8-tag.warn{background:var(--warm-bg,#fff0d6);color:var(--warn)}
.g8-tag.pin{background:var(--accent-soft);color:var(--accent-deep)}
.g8-step{font-size:12px;color:var(--muted);font-weight:700;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g8-side{display:flex;align-items:center;gap:2px}
.g8-dur{font-size:12.5px;font-weight:800;color:var(--muted);min-width:28px;text-align:right}
.g8-star{width:30px;height:44px;border:0;background:transparent;color:var(--muted);font-size:19px;line-height:1;display:grid;place-items:center;padding:0}
.g8-star.on{color:#e8a317}
.g8-more{width:26px;height:44px;border:0;background:transparent;color:var(--muted);font-size:18px;font-weight:800;padding:0}
.g8-free{display:flex;align-items:center;gap:8px;min-height:40px;padding:4px 12px 4px 56px;color:var(--muted);font-size:13px;font-weight:700;opacity:.8}
.g8-choose{grid-column:3/-1;display:flex;flex-wrap:wrap;gap:4px;padding:2px 4px 6px}
.g8-choose button{min-height:34px;padding:2px 10px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:12.5px;color:var(--ink)}
.g8-choose button.go{border-color:var(--hot);color:var(--hot)}
.g8-fab{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));z-index:30;display:flex;gap:8px;justify-content:space-between;padding:0 14px;pointer-events:none;max-width:1180px;margin:0 auto}
.g8-fab>*{pointer-events:auto}
.g8-fab .btn{box-shadow:0 3px 0 rgba(0,0,0,.12);white-space:nowrap;min-height:46px !important;padding:4px 14px;font-size:14px}
.g8-fab-r{display:flex;gap:8px}
@media (min-width:1024px){.g8-fab{bottom:20px;justify-content:flex-end}.g8-fab .g8-unplaced-btn{display:none}}
.g8-un{background:var(--surface);border-radius:20px;padding:12px;box-shadow:var(--shadow)}
.g8-un h2{margin:0 0 6px;font-size:17px;display:flex;align-items:center;gap:8px}
.g8-un h2 .badge{font-size:13px}
.g8-search{width:100%;box-sizing:border-box;min-height:44px;border:2px solid var(--line);border-radius:99px;padding:6px 14px;background:var(--bg);font:inherit;font-weight:700;color:var(--ink)}
.g8-un ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.g8-un li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px;min-height:48px;padding:2px 4px 2px 8px;border-radius:12px;background:color-mix(in srgb,var(--plain-bg) 60%,transparent)}
.g8-un .g8-add{min-height:40px;padding:0 12px;border-radius:99px;border:2px solid var(--accent);background:var(--surface);color:var(--accent-deep);font-weight:800;font-size:13px;white-space:nowrap}
.g8-sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;border-radius:24px 24px 0 0;background:var(--surface);box-shadow:0 -10px 40px rgba(60,20,40,.25);padding:14px 14px 20px;max-height:72vh;overflow:auto}
.g8-sheet-back{position:fixed;inset:0;background:rgba(40,20,32,.45);z-index:55}
.g8-grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 10px}
.g8-tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:2px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));font-size:12px;font-weight:800;color:var(--muted)}
.g8-tabbar span{display:grid;justify-items:center;gap:2px;min-width:52px;min-height:44px;align-content:center;border-radius:14px}
.g8-tabbar span.on{background:var(--accent-soft);color:var(--accent-deep)}
@media (min-width:1024px){.g8-tabbar{display:none}}
</style>
</head>
<body>
<div class="bg-flowers" id="bg-flowers" aria-hidden="true"></div>
<div id="app"></div>
<script>
/* ===== Dữ liệu minh họa (lấy tên việc từ dữ liệu mẫu) và cách tính giờ theo SPEC-GD8 mục 5 ===== */
var Q = new URLSearchParams(location.search);
var STATE = Q.get('s') || 'draft';           // draft | mid | end
var SHEET = Q.get('sheet') === '1';
var DARK = Q.get('theme') === 'dark';
if (DARK) document.documentElement.setAttribute('data-theme', 'dark');

var LUNCH_S = 720, LUNCH_E = 810, WORK_END = 1050;
function hm(m) { return Math.floor(m / 60) + ':' + ('0' + (m % 60)).slice(-2); }
function min(s) { var a = s.split(':'); return +a[0] * 60 + +a[1]; }
function advance(c, n) { // tiến n phút làm việc, bỏ nghỉ trưa
  while (n > 0) {
    if (c >= LUNCH_S && c < LUNCH_E) c = LUNCH_E;
    var room = c < LUNCH_S ? LUNCH_S - c : n, step = Math.min(n, room);
    c += step; n -= step;
  }
  return c;
}
/* items: theo thứ tự. pin = giờ cố định (luôn hiện đúng giờ ghim). intr = đột xuất đã ghi (at = giờ ghi). */
function layout(items, now) {
  var c = min('8:00'), firstUndone = true;
  items.forEach(function (it) {
    if (it.kind === 'intr') { c = Math.max(c, it.at); it.start = c; c = c + it.dur; if (c > LUNCH_S && it.start < LUNCH_S) c = advance(it.start, it.dur); return; }
    if (it.pin) { it.start = it.pin; if (c < it.pin) c = it.pin; c = Math.max(c, it.pin) ; var e = advance(it.pin, it.dur); c = Math.max(c, e); it.late = !it.done && now > e; return; }
    if (it.done) { if (c < LUNCH_S && false) c = c; it.start = it.start0; c = Math.max(c, it.end0 || c); return; }
    if (firstUndone && now != null) { c = Math.max(c, now); firstUndone = false; }
    if (c >= LUNCH_S && c < LUNCH_E) c = LUNCH_E;
    it.start = c; it.end = advance(c, it.dur); c = it.end; it.nokip = it.end > WORK_END;
  });
  return items;
}

var DATA = {
  draft: { now: min('8:10'), title: 'Thứ Tư, 25/11', nav: 'Hôm nay', caps: [['Giờ làm', 255, 266], ['Tối', 75, 90]], slow: 3, un: 10, draft: true,
    allday: [['Uống nước 2 lít', 4, false]],
    morning: [
      { t: 'Báo cáo daily', dur: 15, pin: min('8:00'), tags: [['pin', 'Ghim'], ['', 'Lặp lại']] },
      { t: 'Vẽ biểu đồ so sánh các quý', dur: 60, star: 1, tags: [['hot', 'Hạn hôm nay']], step: 'Mở file số liệu quý 3, chọn 4 chỉ số chính' },
      { t: 'Gửi bảng KPI nháp cho anh Minh', dur: 30, star: 1, tags: [['hot', 'Quá hạn 1 ngày']] },
      { t: 'Làm phần số liệu', dur: 60, star: 1, tags: [] },
      { t: 'Viết phần nhận xét và đề xuất', dur: 60, tags: [['warn', 'Đã dời 3 lần']], choose: true },
      { t: 'Gửi file cho trưởng phòng', dur: 15, tags: [['', 'Hạn ngày mai']] },
      { t: 'Trả lời email khách hàng', dur: 30, tags: [] }
    ],
    evening: [
      { t: 'Làm bài kiểm tra cuối khóa', dur: 60, fixedStart: min('20:00'), tags: [['hot', 'Hạn hôm nay']], step: 'Mở đề, làm câu 1' },
      { t: 'Đọc sách 20 phút', dur: 15, fixedStart: min('21:00'), habit: 12, tags: [] }
    ] },
  mid: { now: min('10:50'), title: 'Thứ Tư, 25/11', nav: 'Hôm nay', caps: [['Giờ làm', 180, 206], ['Tối', 75, 90]], slow: 3, un: 12,
    allday: [['Uống nước 2 lít', 4, true]],
    morning: [
      { t: 'Báo cáo daily', dur: 15, pin: min('8:00'), done: true, start0: min('8:00'), end0: min('8:15'), tags: [['pin', 'Ghim']] },
      { t: 'Vẽ biểu đồ so sánh các quý', dur: 60, star: 1, done: true, start0: min('8:15'), end0: min('9:15'), tags: [] },
      { t: 'Gửi bảng KPI nháp cho anh Minh', dur: 30, star: 1, done: true, start0: min('9:15'), end0: min('9:45'), tags: [] },
      { kind: 'intr', t: 'Hỗ trợ sale lấy data', dur: 60, at: min('9:45'), tags: [['warn', 'Đột xuất']] },
      { t: 'Làm phần số liệu', dur: 60, star: 1, now: true, tags: [] },
      { t: 'Trả lời email khách hàng', dur: 30, tags: [] }
    ],
    evening: [
      { t: 'Làm bài kiểm tra cuối khóa', dur: 60, fixedStart: min('20:00'), tags: [['hot', 'Hạn hôm nay']] },
      { t: 'Đọc sách 20 phút', dur: 15, fixedStart: min('21:00'), habit: 12, tags: [] }
    ] },
  end: { now: min('17:05'), title: 'Thứ Tư, 25/11', nav: 'Hôm nay', caps: [['Giờ làm', 240, 206], ['Tối', 75, 90]], slow: 3, un: 12,
    allday: [['Uống nước 2 lít', 4, false]],
    morning: [
      { t: 'Báo cáo daily', dur: 15, pin: min('8:00'), tags: [['pin', 'Ghim']] },
      { t: 'Vẽ biểu đồ so sánh các quý', dur: 60, star: 1, done: true, start0: min('8:15'), end0: min('9:15'), tags: [] },
      { t: 'Gửi bảng KPI nháp cho anh Minh', dur: 30, star: 1, done: true, start0: min('9:15'), end0: min('9:45'), tags: [] },
      { kind: 'intr', t: 'Hỗ trợ sale lấy data', dur: 60, at: min('9:45'), done: true, start0: min('9:45'), end0: min('10:45'), tags: [['warn', 'Đột xuất']] },
      { t: 'Làm phần số liệu', dur: 60, star: 1, done: true, start0: min('10:45'), end0: min('11:45'), tags: [] },
      { t: 'Viết phần nhận xét và đề xuất', dur: 60, now: true, tags: [['warn', 'Đã dời 3 lần']] },
      { t: 'Trả lời email khách hàng', dur: 30, tags: [] }
    ],
    evening: [
      { t: 'Làm bài kiểm tra cuối khóa', dur: 60, fixedStart: min('20:00'), tags: [['hot', 'Hạn hôm nay']] },
      { t: 'Đọc sách 20 phút', dur: 15, fixedStart: min('21:00'), habit: 12, tags: [] }
    ] }
};
var UNPLACED = [
  ['Mua giấy in cho phòng', '15p', 'Hạn hôm nay', 'hot'], ['Gia hạn bảo hiểm xe', '30p', 'Hạn ngày mai', ''],
  ['Cập nhật file theo dõi đơn hàng', '1h', 'Nằm kho 2 ngày', ''], ['Làm phần kế hoạch quý sau', '1h', 'Quan trọng', ''],
  ['Đặt lịch khám răng', '15p', 'Nằm kho 12 ngày', 'warn'], ['Chạy 5 km cuối tuần', '1h', 'Hạn 27/11', '']
];

function el(h) { var d = document.createElement('div'); d.innerHTML = h; return d.firstChild; }
function row(it, draft) {
  var cls = 'g8-row' + (draft ? ' draft' : '') + (it.done ? ' done' : '') + (it.now ? ' now' : '');
  var tags = (it.tags || []).slice(0, 2).map(function (g) { return '<span class="g8-tag ' + g[0] + '">' + g[1] + '</span>'; }).join('');
  if (it.late) tags = '<span class="g8-tag hot">Trễ</span>' + tags;
  if (it.nokip) tags = '<span class="g8-tag hot">Không kịp hôm nay</span><span class="g8-tag pin">Về kho</span>';
  if (it.habit) tags += '<span class="g8-tag">Thói quen</span><span class="g8-streak">' + it.habit + ' ngày</span>';
  var time = hm(it.start);
  var star = it.kind === 'intr' ? '' : '<button class="g8-star' + (it.star && !draft ? ' on' : '') + '" aria-label="Việc chính">' + (it.star ? (draft ? '&#9734;' : '&#9733;') : '&#9734;') + '</button>';
  return '<li class="' + cls + '"><span class="g8-time">' + time + '</span><button class="g8-tick" aria-label="Tick xong"><i>' + (it.done ? '&#10003;' : '') + '</i></button>' +
    '<div class="g8-main"><span class="g8-title">' + it.t + '</span>' + (tags ? '<div class="g8-tags">' + tags + '</div>' : '') + (it.step && !it.done ? '<div class="g8-step">Bước đầu: ' + it.step + '</div>' : '') + '</div>' +
    '<div class="g8-side"><span class="g8-dur">' + (it.dur >= 60 ? (it.dur / 60) + 'h' : it.dur + 'p') + '</span>' + star + '<button class="g8-more" aria-label="Thêm">&#8943;</button></div>' +
    (it.choose ? '<div class="g8-choose"><span class="muted" style="font-size:12px;font-weight:800;width:100%">Đã dời 3 lần, chọn cách xử lý:</span><button>Chia nhỏ</button><button>Hỏi lại</button><button class="go">Bỏ</button><button>Vẫn giữ</button></div>' : '') + '</li>';
}
function render() {
  var d = DATA[STATE], draft = !!d.draft;
  var all = layout(d.morning, d.now);
  // Chiều/Sáng: chèn vạch nghỉ trưa theo giờ
  var html = '';
  var beforeLunch = [], afterLunch = [];
  all.forEach(function (it) { (it.start < LUNCH_S ? beforeLunch : afterLunch).push(it); });
  var ev = d.evening.map(function (x) { x.start = x.fixedStart; return x; });
  var capHtml = d.caps.map(function (c, i) {
    var over = c[1] > c[2], pct = Math.min(100, c[1] / c[2] * 100);
    return '<div style="flex:' + (i ? 1 : 2) + '"><div class="g8-cap-row"><span>' + c[0] + '</span><span class="num">' + hm2(c[1]) + ' / ' + hm2(c[2]) + '</span></div><div class="g8-bar"><i style="flex:1"><b style="display:block;width:' + pct + '%"></b></i></div></div>';
  }).join('');
  function hm2(m) { return Math.floor(m / 60) + 'h' + (m % 60 ? ('0' + (m % 60)).slice(-2) : ''); }
  var overW = d.caps[0][1] > d.caps[0][2];
  var free = d.caps[0][2] - d.caps[0][1];
  var left = '<div class="g8-top"><button class="g8-nav" aria-label="Ngày trước">&#8249;</button><h1>' + d.nav + '<small>' + d.title + '</small></h1><button class="g8-nav" aria-label="Ngày sau">&#8250;</button></div>' +
    '<div class="g8-cap"><div style="display:flex;gap:12px">' + capHtml + '</div>' + (overW ? '<div class="g8-over">Giờ làm quá tải ' + (d.caps[0][1] - d.caps[0][2]) + ' phút. Gợi ý: đưa việc cuối về kho.</div>' : '') + '</div>' +
    (d.slow ? '<button class="g8-slow"><span><b class="num">' + d.slow + '</b> mục tiêu chậm tiến độ</span><b>&#8250;</b></button>' : '') +
    '<div class="g8-day"><b>CẢ NGÀY</b>' + d.allday.map(function (a) { return '<span class="g8-chip' + (a[2] ? ' done' : '') + '"><span class="dot">' + (a[2] ? '&#10003;' : '') + '</span>' + a[0] + '<span class="g8-streak">' + a[1] + ' ngày</span></span>'; }).join('') + '</div>' +
    (draft ? '<div class="g8-draft"><p>Bản nháp: kéo đổi thứ tự, bỏ bớt, hoặc thêm từ Chưa xếp. Tick việc đầu tiên là chốt.</p><button class="btn btn-primary" style="min-height:44px">Chốt</button></div>' : '') +
    '<div class="g8-seg">Sáng</div><ul class="g8-rows">' + beforeLunch.map(function (i) { return row(i, draft); }).join('') + '</ul>' +
    '<div class="g8-lunch">Nghỉ trưa 12:00 đến 13:30</div>' +
    '<div class="g8-seg">Chiều</div><ul class="g8-rows">' + afterLunch.map(function (i) { return row(i, draft); }).join('') + '</ul>' +
    (!overW && free > 0 ? '<div class="g8-free">Còn trống ~' + free + ' phút, dự phòng đột xuất</div>' : '') +
    '<div class="g8-seg">Tối</div><ul class="g8-rows">' + ev.map(function (i) { return row(i, draft); }).join('') + '</ul>' +
    '<div class="g8-free">Còn trống ~' + (d.caps[1][2] - d.caps[1][1]) + ' phút</div>';
  var unplaced = '<aside class="g8-un"><h2>Chưa xếp <span class="badge num">' + d.un + '</span></h2><input class="g8-search" placeholder="Tìm trong Chưa xếp"><ul>' +
    UNPLACED.map(function (u) { return '<li><div class="g8-main"><span class="g8-title">' + u[0] + '</span><div class="g8-tags"><span class="g8-tag">' + u[1] + '</span><span class="g8-tag ' + u[3] + '">' + u[2] + '</span></div></div><button class="g8-add">Xếp vào hôm nay</button></li>'; }).join('') + '</ul></aside>';
  var fab = '<div class="g8-fab"><button class="btn btn-soft g8-unplaced-btn" style="min-height:48px;background:var(--surface)">Chưa xếp &middot; <span class="num">' + d.un + '</span></button><div class="g8-fab-r"><button class="btn btn-soft" style="min-height:48px;background:var(--surface)">Đột xuất</button><button class="btn btn-primary" style="min-height:48px">+ Việc</button></div></div>';
  var tabs = '<nav class="g8-tabbar"><span class="on">Agenda</span><span>Task</span><span>Ma trận</span><span>Mục tiêu</span><span>Thói quen</span><span>Tổng kết</span></nav>';
  var sheet = SHEET ? '<div class="g8-sheet-back"></div><div class="g8-sheet"><div class="g8-grab"></div>' + unplaced + '</div>' : '';
  document.getElementById('app').innerHTML = '<div class="g8"><div class="g8-cols"><div>' + left + '</div><div class="g8-right" id="g8r">' + unplaced + '</div></div></div>' + fab + tabs + sheet;
  if (window.innerWidth < 1024) document.getElementById('g8r').style.display = 'none';
  addEventListener('resize', function () { document.getElementById('g8r').style.display = innerWidth < 1024 ? 'none' : ''; });
}
render();
</script>
</body>
</html>
